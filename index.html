<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个记录生活、学习与想法的小小博客。">
  <title>小小博客 · 日常与想法</title>
  <style>
    :root{--bg:#f7f6f2;--text:#292e2a;--muted:#777c74;--line:#e0e2d9;--green:#45664c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:6px}header{max-width:1000px;margin:auto;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:650;letter-spacing:.04em}.dot{display:inline-block;width:9px;height:9px;background:var(--green);border-radius:50%;margin-right:10px}nav{display:flex;gap:26px;font-size:14px;color:var(--muted)}nav a[aria-current=page]{color:var(--green)}main{max-width:760px;margin:76px auto 100px;padding:0 28px;min-height:55vh}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--green);text-transform:uppercase}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(32px,6vw,48px);line-height:1.35;font-weight:500;margin:17px 0 20px;letter-spacing:.02em}.intro{color:var(--muted);margin:0;font-size:16px}.section-label{margin:65px 0 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.08em}.post{display:block;padding:27px 0;border-bottom:1px solid var(--line)}.meta{font-size:12px;color:var(--muted)}.tag{color:var(--green);margin-left:16px}h2{font-size:21px;font-weight:550;margin:8px 0}.post p{font-size:14px;color:var(--muted);margin:0}.post:hover h2{color:var(--green)}.post:hover .arrow{transform:translateX(4px)}.post-title{display:flex;align-items:center;justify-content:space-between;gap:14px}.arrow{font-size:20px;color:var(--green);transition:transform .2s}.sample{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;margin-left:8px;color:var(--muted)}footer{max-width:1000px;padding:25px 32px;margin:auto;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted)}.back{font-size:14px;color:var(--green);display:inline-block;margin-bottom:28px}.article h1{font-size:36px}.article-body{margin-top:35px;line-height:2}.article-body p{margin:0 0 22px}.article-body h2{margin-top:35px}.note{margin-top:35px;border-left:2px solid var(--green);padding:10px 18px;color:var(--muted);font-size:14px}.about{max-width:620px}.about p{margin-bottom:24px}.about h2{margin-top:40px}@media(max-width:600px){header{padding:22px 24px}main{margin-top:48px;padding:0 24px}nav{gap:18px}.section-label{margin-top:48px}footer{padding:24px;flex-direction:column;gap:3px}.article h1{font-size:30px}}
  </style>
</head>
<body>
  <header><a class="brand" href="#"><span class="dot"></span>小小博客</a><nav aria-label="主导航"><a id="home-link" href="#">文章</a><a id="about-link" href="#about">关于</a></nav></header>
  <main id="content"></main>
  <footer><span>© <span id="year"></span> 小小博客</span><span>慢慢生活，认真记录。</span></footer>
  <script>
    // 改博客名称：替换本文件中的“小小博客”。新增文章：在 posts 数组中添加一项。
    const posts = [
      {id:'hello-world',date:'2026-10-10',tag:'随笔',title:'你好，这是我的第一篇博客',summary:'给想法留一个位置，也给日常留一点回声。',body:`<p>欢迎来到这个小小的角落。</p><p>我想在这里记录一些生活片段、学习心得，以及偶尔冒出来的想法。不必每篇都很完整，也不必每个想法都有答案。</p><h2>为什么开始写博客？</h2><p>有些事情，写下来之后才真正看清楚。也希望过一段时间回头看时，能记得当时的自己在关心什么、尝试什么。</p><p>那就从这一篇开始吧。慢慢写，慢慢积累。</p>`},
      {id:'small-things',date:'2026-10-09',tag:'生活',title:'把普通的一天，记下来',summary:'一杯茶、几页书，以及一个没有那么匆忙的下午。',body:`<p>今天没有什么大事发生。</p><p>泡了一杯茶，读了几页书。窗边的光慢慢移动，杯子里的茶也渐渐凉下来。</p><p>以前总觉得，只有特别的事情才值得记录。后来发现，普通的一天，也有它自己的纹理。</p><p>试着留意一点小事：今天听到了什么、学到了什么，或者什么让自己笑了一下。这些细小的东西，也能成为一篇文章的起点。</p>`}
    ];
    const content=document.getElementById('content');
    function render(){
      const route=location.hash.slice(1);
      document.getElementById('home-link').setAttribute('aria-current',route==='about'?'false':'page');
      document.getElementById('about-link').setAttribute('aria-current',route==='about'?'page':'false');
      if(route==='about'){
        document.title='关于 · 小小博客';
        content.innerHTML=`<div class="about"><div class="eyebrow">About this little corner</div><h1>你好，欢迎来坐坐。</h1><p>这是一个记录生活、学习与想法的个人博客。</p><p>我喜欢把值得记住的小事写下来，也把还没想明白的问题留在这里。希望这些文字，能陪伴未来的自己，也能与你产生一点共鸣。</p><h2>这里会写些什么</h2><p>日常随笔、读书笔记、学习记录，以及一些正在探索的事情。</p><div class="note">这段文字是示例介绍。你可以换成自己的名字、经历与兴趣；想留下联系方式，也可以加在这里。</div></div>`;
      }else{
        const post=posts.find(p=>route==='post/'+p.id);
        if(post){document.title=post.title+' · 小小博客';content.innerHTML=`<article class="article"><a class="back" href="#">← 返回文章列表</a><div class="meta"><time datetime="${post.date}">${post.date.replaceAll('-',' / ')}</time><span class="tag">${post.tag}</span><span class="sample">示例文章</span></div><h1>${post.title}</h1><div class="article-body">${post.body}</div></article>`;}
        else{document.title='小小博客 · 日常与想法';content.innerHTML=`<div class="eyebrow">Notes on everyday life</div><h1>记录一点日常，<br>留住一些想法。</h1><p class="intro">一个安静的角落，写生活，也写正在学习的事。</p><div class="section-label"><span>最新文章</span><span>${posts.length} 篇文字</span></div>${posts.map(p=>`<a class="post" href="#post/${p.id}"><div class="meta"><time datetime="${p.date}">${p.date.replaceAll('-',' / ')}</time><span class="tag">${p.tag}</span><span class="sample">示例</span></div><div class="post-title"><h2>${p.title}</h2><span class="arrow" aria-hidden="true">↗</span></div><p>${p.summary}</p></a>`).join('')}`;}
      }
      window.scrollTo(0,0);
    }
    document.getElementById('year').textContent=new Date().getFullYear();
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
